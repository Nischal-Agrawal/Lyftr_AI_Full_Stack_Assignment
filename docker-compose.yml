version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lyftr-chatbot-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////data/app.db
      - ENABLE_FAILURE_SIMULATION=true
      - ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - LLM_API_KEYS=${LLM_API_KEYS:-mock-key-alpha-12345,mock-key-beta-67890}
      - LLM_MODEL=${LLM_MODEL:-gemini/gemini-2.0-flash}
      - LLM_MODELS=${LLM_MODELS:-}
      - DEFAULT_SYSTEM_PROMPT=${DEFAULT_SYSTEM_PROMPT:-You are a helpful, concise AI assistant.}
      - LITELLM_CACHE_TYPE=${LITELLM_CACHE_TYPE:-local}
      - LLM_TIMEOUT_SECONDS=${LLM_TIMEOUT_SECONDS:-25}
    volumes:
      - sqlite_data:/data
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")'"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:8000
    container_name: lyftr-chatbot-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sqlite_data:
