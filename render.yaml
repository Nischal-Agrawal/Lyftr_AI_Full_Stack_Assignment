services:
  # ------------------------------------------
  # Backend API Service (FastAPI + LiteLLM + SQLite)
  # ------------------------------------------
  - type: web
    name: lyftr-chatbot-backend
    env: python
    region: oregon
    plan: starter
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    disk:
      name: sqlite-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        value: sqlite:////data/app.db
      - key: ENABLE_FAILURE_SIMULATION
        value: "true"
      - key: LLM_API_KEYS
        sync: false
      - key: LLM_MODEL
        value: gemini/gemini-2.0-flash
      - key: ALLOWED_ORIGINS
        value: https://lyftr-chatbot-frontend.vercel.app,http://localhost:3000
